<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Something, For You</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Great+Vibes&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f7efe8;
      font-family: 'Cormorant Garamond', serif;
    }

    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s ease;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* ---------------- SCENE 1: BOW & HEART ---------------- */
    #scene1 {
      background: radial-gradient(circle at 60% 40%, #f5d7e3 0%, #f5ece6 50%, #efe6dd 100%);
    }

    .top-sub {
      position: absolute;
      top: 18%;
      left: 55%;
      transform: translateX(-50%);
      font-style: italic;
      font-size: 1.35rem;
      color: #6d4c5b;
      white-space: nowrap;
    }

    #heart-target {
      position: absolute;
      top: 25%;
      left: 55%;
      transform: translate(-50%, 0);
      width: 140px;
      height: 140px;
      filter: drop-shadow(0 20px 30px rgba(216, 43, 119, 0.35));
      animation: floatHeart 3s ease-in-out infinite;
    }

    @keyframes floatHeart {
      0%, 100% { transform: translate(-50%, 0px) scale(1); }
      50% { transform: translate(-50%, -12px) scale(1.04); }
    }

    .instruction {
      position: absolute;
      bottom: 10%;
      font-size: 0.85rem;
      letter-spacing: 3px;
      color: #7c6870;
      text-transform: uppercase;
    }

    #bow-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    #pink-burst {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: #c90f64;
      border-radius: 50%;
      top: 35%;
      left: 55%;
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      z-index: 20;
      transition: transform 0.9s cubic-bezier(0.65, 0, 0.35, 1);
    }

    /* ---------------- SCENE 2: PINK BANNER ---------------- */
    #scene2 {
      background-color: #f5ece6;
      z-index: 25;
    }

    .banner-bar {
      width: 100%;
      height: 58%;
      background-color: #c90f64;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      position: relative;
      box-shadow: 0 10px 40px rgba(201, 15, 100, 0.25);
    }

    .wish-text {
      font-style: italic;
      font-size: 1.4rem;
      color: #f7d4e3;
      margin-bottom: 10px;
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.8s ease 0.3s;
    }

    .hb-main {
      font-family: 'Playfair Display', serif;
      font-size: 5rem;
      line-height: 0.95;
      text-align: center;
      letter-spacing: -1px;
      opacity: 0;
      transform: scale(0.92);
      transition: all 0.8s ease 0.6s;
    }

    .gold-swish {
      width: 220px;
      height: 30px;
      margin-top: 8px;
    }

    .gold-swish path {
      stroke-dasharray: 500;
      stroke-dashoffset: 500;
      transition: stroke-dashoffset 1.2s ease 1.1s;
    }

    .sub-worth {
      font-style: italic;
      font-size: 1.25rem;
      color: #f7d4e3;
      margin-top: 6px;
      opacity: 0;
      transition: opacity 0.8s ease 1.4s;
    }

    #scene2.active .wish-text { opacity: 1; transform: translateY(0); }
    #scene2.active .hb-main { opacity: 1; transform: scale(1); }
    #scene2.active .gold-swish path { stroke-dashoffset: 0; }
    #scene2.active .sub-worth { opacity: 1; }

    /* ---------------- SCENE 3: HEART TREE ---------------- */
    #scene3 {
      background: radial-gradient(circle at 65% 45%, #f7e2ec 0%, #f3eae2 60%, #ebe0d6 100%);
      z-index: 30;
    }

    #tree-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .left-message {
      position: absolute;
      left: 8%;
      bottom: 14%;
      z-index: 35;
      opacity: 0;
      transform: translateY(20px);
      transition: all 1s ease;
      background: rgba(247, 239, 232, 0.65);
      backdrop-filter: blur(3px);
      padding: 10px 18px;
      border-radius: 12px;
    }

    .left-message.show {
      opacity: 1;
      transform: translateY(0);
    }

    .left-message .count-text {
      font-style: italic;
      font-size: 1.4rem;
      color: #8c3b5a;
      margin-bottom: -4px;
    }

    .left-message .script-hb {
      font-family: 'Great Vibes', cursive;
      font-size: 4.8rem;
      color: #c90f64;
      padding: 4px 0;
      border-top: 1px solid rgba(201, 15, 100, 0.3);
      border-bottom: 1px solid rgba(201, 15, 100, 0.3);
      margin: 6px 0;
      white-space: nowrap;
    }

    .left-message .bloom-sub {
      font-style: italic;
      font-size: 1.2rem;
      color: #6d4c5b;
    }

    @media (max-width: 768px) {
      .hb-main { font-size: 3.5rem; }
      .left-message {
        left: 5%;
        bottom: 6%;
        padding: 8px 14px;
      }
      .left-message .count-text { font-size: 1.2rem; }
      .left-message .script-hb { font-size: 3.1rem; }
      .left-message .bloom-sub { font-size: 1.05rem; }
      #heart-target { width: 115px; height: 115px; }
    }
  </style>
</head>
<body>

  <!-- SCENE 1: Bow and Arrow -->
  <div id="scene1" class="screen">
    <div class="top-sub">a little something, for you</div>

    <svg id="heart-target" viewBox="0 0 200 200">
      <defs>
        <radialGradient id="glossyHeart" cx="35%" cy="30%" r="65%">
          <stop offset="0%" stop-color="#ff99c8" />
          <stop offset="35%" stop-color="#e82578" />
          <stop offset="80%" stop-color="#a8064d" />
          <stop offset="100%" stop-color="#700232" />
        </radialGradient>
        <filter id="blurHighlight">
          <feGaussianBlur stdDeviation="4" />
        </filter>
      </defs>
      <path d="M100,175 C100,175 20,120 20,65 C20,30 50,15 75,15 C90,15 100,28 100,28 C100,28 110,15 125,15 C150,15 180,30 180,65 C180,120 100,175 100,175 Z" fill="url(#glossyHeart)" />
      <ellipse cx="62" cy="52" rx="18" ry="10" transform="rotate(-30 62 52)" fill="rgba(255,255,255,0.45)" filter="url(#blurHighlight)" />
    </svg>

    <svg id="bow-svg">
      <g id="bow-group">
        <polyline id="bow-string" points="0,-70 0,0 0,70" fill="none" stroke="#8c6d62" stroke-width="1.8" />
        <path d="M 0,-70 C 35,-32 35,32 0,70" fill="none" stroke="#4a2511" stroke-width="4.5" stroke-linecap="round" />
      </g>

      <g id="arrow-group">
        <line x1="-60" y1="0" x2="32" y2="0" stroke="#5c3828" stroke-width="3" />
        <path d="M -50,0 L -62,-8 L -52,-8 L -40,0 Z" fill="#e82578" />
        <path d="M -50,0 L -62,8 L -52,8 L -40,0 Z" fill="#ff7aa8" />
        <path d="M 42,0 L 28,-8 C 24,-10 22,-4 28,0 C 22,4 24,10 28,8 Z" fill="#d91b6b" />
      </g>
    </svg>

    <div class="instruction">PULL &amp; RELEASE</div>
    <div id="pink-burst"></div>
  </div>

  <!-- SCENE 2: Pink Birthday Banner -->
  <div id="scene2" class="screen hidden">
    <div class="banner-bar">
      <div class="wish-text">make a wish...</div>
      <div class="hb-main">Happy<br>Birthday</div>
      <svg class="gold-swish" viewBox="0 0 300 40">
        <path d="M 20,25 Q 150,5 280,20 Q 170,38 70,28" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <div class="sub-worth">to someone worth celebrating</div>
    </div>
  </div>

  <!-- SCENE 3: Growing Tree & Heart Leaves -->
  <div id="scene3" class="screen hidden">
    <canvas id="tree-canvas"></canvas>
    <div class="left-message" id="final-text">
      <div class="count-text">and... make it count</div>
      <div class="script-hb">Happy Birthday</div>
      <div class="bloom-sub">Here's to a year that blooms</div>
    </div>
  </div>

  <script>
    /* ================= SCENE 1 LOGIC ================= */
    const bowSvg = document.getElementById('bow-svg');
    const bowGroup = document.getElementById('bow-group');
    const bowString = document.getElementById('bow-string');
    const arrowGroup = document.getElementById('arrow-group');
    const heartTarget = document.getElementById('heart-target');
    const pinkBurst = document.getElementById('pink-burst');

    let bowX, bowY, targetX, targetY, bowAngle;
    let isDragging = false;
    let pullDist = 0;
    let arrowLaunched = false;

    function updatePositions() {
      bowX = window.innerWidth * 0.28;
      bowY = window.innerHeight * 0.68;
      const rect = heartTarget.getBoundingClientRect();
      targetX = rect.left + rect.width / 2;
      targetY = rect.top + rect.height / 2;
      bowAngle = Math.atan2(targetY - bowY, targetX - bowX);
      renderBow(0);
    }

    function renderBow(pull) {
      const deg = bowAngle * (180 / Math.PI);
      bowGroup.setAttribute('transform', `translate(${bowX}, ${bowY}) rotate(${deg})`);
      bowString.setAttribute('points', `0,-70 ${-pull},0 0,70`);

      if (!arrowLaunched) {
        const offsetX = Math.cos(bowAngle) * (-pull);
        const offsetY = Math.sin(bowAngle) * (-pull);
        arrowGroup.setAttribute('transform', `translate(${bowX + offsetX}, ${bowY + offsetY}) rotate(${deg})`);
      }
    }

    window.addEventListener('resize', updatePositions);
    updatePositions();

    function startDrag() {
      if (arrowLaunched) return;
      isDragging = true;
    }

    function onDrag(e) {
      if (!isDragging || arrowLaunched) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const dx = bowX - clientX;
      const dy = bowY - clientY;
      pullDist = Math.min(Math.max(Math.hypot(dx, dy) * 0.65, 0), 80);

      bowAngle = Math.atan2(targetY - bowY, targetX - bowX);
      renderBow(pullDist);
    }

    function endDrag() {
      if (!isDragging || arrowLaunched) return;
      isDragging = false;

      if (pullDist > 20) {
        launchArrow();
      } else {
        pullDist = 0;
        renderBow(0);
      }
    }

    bowSvg.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', onDrag);
    window.addEventListener('mouseup', endDrag);

    bowSvg.addEventListener('touchstart', startDrag);
    window.addEventListener('touchmove', onDrag);
    window.addEventListener('touchend', endDrag);

    function launchArrow() {
      arrowLaunched = true;
      bowString.setAttribute('points', `0,-70 0,0 0,70`);

      let startX = bowX;
      let startY = bowY;
      const deg = bowAngle * (180 / Math.PI);
      let progress = 0;

      function animateArrow() {
        progress += 0.06;
        const curX = startX + (targetX - startX) * progress;
        const curY = startY + (targetY - startY) * progress;
        arrowGroup.setAttribute('transform', `translate(${curX}, ${curY}) rotate(${deg})`);

        if (progress < 0.95) {
          requestAnimationFrame(animateArrow);
        } else {
          triggerScene2();
        }
      }
      requestAnimationFrame(animateArrow);
    }

    /* ================= SCENE 2 TRANSITION ================= */
    function triggerScene2() {
      pinkBurst.style.left = `${targetX}px`;
      pinkBurst.style.top = `${targetY}px`;
      pinkBurst.style.transform = 'translate(-50%, -50%) scale(240)';

      setTimeout(() => {
        document.getElementById('scene1').classList.add('hidden');
        const scene2 = document.getElementById('scene2');
        scene2.classList.remove('hidden');
        setTimeout(() => scene2.classList.add('active'), 50);
        setTimeout(triggerScene3, 4000);
      }, 850);
    }

    /* ================= SCENE 3 LOGIC (FULL HEART TREE) ================= */
    function triggerScene3() {
      document.getElementById('scene2').classList.add('hidden');
      document.getElementById('scene3').classList.remove('hidden');
      initTreeCanvas();
    }

    function initTreeCanvas() {
      const canvas = document.getElementById('tree-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const isMobile = canvas.width < 768;

      // Unified scale so branches & heart canopy ALWAYS match 100%
      const heartScale = isMobile
        ? Math.min(canvas.width * 0.022, canvas.height * 0.012)
        : Math.min(canvas.width, canvas.height) * 0.0135;

      const treeBaseX = isMobile ? canvas.width * 0.56 : canvas.width * 0.68;
      const treeBaseY = canvas.height;

      // Position heart center comfortably in upper half
      const heartCenterX = treeBaseX;
      const heartCenterY = isMobile ? canvas.height * 0.36 : canvas.height * 0.42;

      // Trunk splits right at the lower inside of the heart
      const trunkTopY = heartCenterY + heartScale * 9;

      let branches = [];
      let balloons = [];
      let floatingHearts = [];

      // Keep branches strictly proportional to heartScale so they stay INSIDE the heart
      function generateBranches(x1, y1, angle, length, depth) {
        if (depth === 0) return;
        const x2 = x1 + Math.cos(angle) * length;
        const y2 = y1 + Math.sin(angle) * length;

        branches.push({
          x1, y1, x2, y2,
          depth,
          progress: 0,
          started: depth === 5
        });

        const spread = 0.32 + Math.random() * 0.14;
        generateBranches(x2, y2, angle - spread, length * 0.72, depth - 1);
        generateBranches(x2, y2, angle + spread, length * 0.72, depth - 1);
        if (depth >= 4) {
          generateBranches(x2, y2, angle + (Math.random() - 0.5) * 0.25, length * 0.75, depth - 1);
        }
      }

      // Initial branch length is locked to heartScale (6.2 * heartScale) so branches never poke out!
      generateBranches(treeBaseX, trunkTopY, -Math.PI / 2, heartScale * 6.2, 5);

      // Generate dense Heart-Shaped Canopy covering all branches
      const palette = [
        '#e82578', '#ff5c9e', '#ff9ebb', '#c90f64',
        '#f4a261', '#ffd166', '#d91b6b', '#ff758f'
      ];

      const totalHearts = 450;
      for (let i = 0; i < totalHearts; i++) {
        const t = Math.random() * Math.PI * 2;
        // Favor filling the whole heart evenly up to the edges
        const r = Math.pow(Math.random(), 0.42);
        const hx = 16 * Math.pow(Math.sin(t), 3);
        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

        balloons.push({
          x: heartCenterX + hx * heartScale * r + (Math.random() - 0.5) * heartScale * 1.2,
          y: heartCenterY + hy * heartScale * r + (Math.random() - 0.5) * heartScale * 1.2,
          size: 0,
          maxSize: heartScale * (1.1 + Math.random() * 1.15),
          color: palette[Math.floor(Math.random() * palette.length)],
          delay: 55 + Math.random() * 85,
          angle: (Math.random() - 0.5) * 0.7
        });
      }

      // Draw actual 3D glossy Heart Leaf / Balloon
      function drawHeartBalloon(x, y, size, color, angle) {
        if (size <= 0.3) return;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        ctx.beginPath();
        const s = size * 0.85;
        ctx.moveTo(0, s * 0.35);
        ctx.bezierCurveTo(-s * 1.1, -s * 0.4, -s * 0.55, -s * 1.15, 0, -s * 0.45);
        ctx.bezierCurveTo(s * 0.55, -s * 1.15, s * 1.1, -s * 0.4, 0, s * 0.35);
        ctx.closePath();

        ctx.fillStyle = color;
        ctx.fill();

        // 3D Glossy Highlight on each heart
        const grad = ctx.createRadialGradient(-s * 0.25, -s * 0.45, s * 0.05, 0, 0, s * 1.1);
        grad.addColorStop(0, 'rgba(255, 255, 255, 0.65)');
        grad.addColorStop(0.45, 'rgba(255, 255, 255, 0)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0.2)');
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.restore();
      }

      let frame = 0;
      let trunkProgress = 0;

      function animateScene3() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        frame++;

        // 1. Grow tapered main trunk
        if (trunkProgress < 1) {
          trunkProgress += 0.03;
        }
        const curTrunkY = treeBaseY - (treeBaseY - trunkTopY) * Math.min(trunkProgress, 1);

        ctx.strokeStyle = '#3d1e10';
        ctx.lineWidth = isMobile ? 12 : 16;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(treeBaseX, treeBaseY);
        ctx.lineTo(treeBaseX, curTrunkY);
        ctx.stroke();

        // 2. Grow branches inside heart region
        if (trunkProgress >= 1) {
          branches.forEach(b => {
            if (b.started && b.progress < 1) {
              b.progress += 0.06;
              if (b.progress >= 1) {
                branches.forEach(child => {
                  if (child.depth === b.depth - 1 && Math.hypot(child.x1 - b.x2, child.y1 - b.y2) < 2) {
                    child.started = true;
                  }
                });
              }
            }

            if (b.started) {
              const p = Math.min(b.progress, 1);
              const curX = b.x1 + (b.x2 - b.x1) * p;
              const curY = b.y1 + (b.y2 - b.y1) * p;

              ctx.strokeStyle = '#3d1e10';
              ctx.lineWidth = Math.max(b.depth * (isMobile ? 1.6 : 2.2), 1.5);
              ctx.beginPath();
              ctx.moveTo(b.x1, b.y1);
              ctx.lineTo(curX, curY);
              ctx.stroke();
            }
          });
        }

        // 3. Show text & bloom full heart canopy
        if (frame > 65) {
          document.getElementById('final-text').classList.add('show');
        }

        balloons.forEach(bl => {
          if (frame > bl.delay) {
            if (bl.size < bl.maxSize) {
              bl.size += (bl.maxSize - bl.size) * 0.12;
            }
            const swayX = Math.sin(frame * 0.03 + bl.delay) * 1.5;
            const swayY = Math.cos(frame * 0.025 + bl.delay) * 1.5;
            drawHeartBalloon(bl.x + swayX, bl.y + swayY, bl.size, bl.color, bl.angle);
          }
        });

        // 4. Floating heart petals drifting in the wind
        if (frame > 110 && Math.random() < 0.1) {
          floatingHearts.push({
            x: heartCenterX + (Math.random() - 0.5) * heartScale * 22,
            y: heartCenterY + (Math.random() - 0.2) * heartScale * 14,
            vx: -0.7 - Math.random() * 0.8,
            vy: 0.4 + Math.random() * 0.6,
            size: heartScale * (0.6 + Math.random() * 0.5),
            color: palette[Math.floor(Math.random() * palette.length)],
            angle: (Math.random() - 0.5) * 0.8,
            alpha: 1
          });
        }

        floatingHearts.forEach((fh, idx) => {
          fh.x += fh.vx;
          fh.y += fh.vy;
          fh.angle += 0.01;
          fh.alpha -= 0.004;
          if (fh.alpha <= 0) {
            floatingHearts.splice(idx, 1);
          } else {
            ctx.save();
            ctx.globalAlpha = fh.alpha;
            drawHeartBalloon(fh.x, fh.y, fh.size, fh.color, fh.angle);
            ctx.restore();
          }
        });

        requestAnimationFrame(animateScene3);
      }

      animateScene3();
    }
  </script>
</body>
</html>
