<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Happy Birthday ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Great+Vibes&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background-color: #f7efe8;
      font-family: 'Cormorant Garamond', serif;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .screen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      transition: opacity 0.7s ease;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* ---------------- SCENE 1: BOW & HEART (MOBILE PORTRAIT) ---------------- */
    #scene1 {
      background: radial-gradient(circle at 50% 30%, #f7d6e4 0%, #f5ece6 55%, #efe5dc 100%);
      z-index: 10;
    }

    .top-sub {
      position: absolute;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      font-style: italic;
      font-size: 1.35rem;
      color: #6d4c5b;
      white-space: nowrap;
      z-index: 2;
    }

    #heart-target {
      position: absolute;
      top: 19%;
      left: 50%;
      transform: translateX(-50%);
      width: 125px;
      height: 125px;
      filter: drop-shadow(0 16px 24px rgba(216, 43, 119, 0.35));
      animation: floatHeart 2.8s ease-in-out infinite;
      z-index: 2;
    }

    @keyframes floatHeart {
      0%, 100% { transform: translate(-50%, 0px) scale(1); }
      50% { transform: translate(-50%, -10px) scale(1.04); }
    }

    #bow-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      touch-action: none;
    }

    .instruction {
      position: absolute;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      letter-spacing: 3px;
      color: #7c6870;
      text-transform: uppercase;
      white-space: nowrap;
      z-index: 2;
    }

    /* Clip-Path Burst (Zero Overflow!) */
    #pink-wipe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #c90f64;
      clip-path: circle(0% at 50% 28%);
      pointer-events: none;
      z-index: 15;
      transition: clip-path 0.85s cubic-bezier(0.65, 0, 0.35, 1);
    }

    /* ---------------- SCENE 2: PINK BANNER ---------------- */
    #scene2 {
      background-color: #f5ece6;
      z-index: 20;
    }

    .banner-bar {
      width: 100%;
      height: 52%;
      background-color: #c90f64;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 0 20px;
      box-shadow: 0 12px 35px rgba(201, 15, 100, 0.25);
    }

    .wish-text {
      font-style: italic;
      font-size: 1.35rem;
      color: #f7d4e3;
      margin-bottom: 8px;
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.7s ease 0.2s;
    }

    .hb-main {
      font-family: 'Playfair Display', serif;
      font-size: 3.8rem;
      line-height: 0.96;
      text-align: center;
      letter-spacing: -0.5px;
      opacity: 0;
      transform: scale(0.92);
      transition: all 0.7s ease 0.5s;
    }

    .gold-swish {
      width: 200px;
      height: 28px;
      margin-top: 8px;
    }

    .gold-swish path {
      stroke-dasharray: 500;
      stroke-dashoffset: 500;
      transition: stroke-dashoffset 1.1s ease 0.9s;
    }

    .sub-worth {
      font-style: italic;
      font-size: 1.2rem;
      color: #f7d4e3;
      margin-top: 6px;
      opacity: 0;
      transition: opacity 0.7s ease 1.2s;
    }

    #scene2.active .wish-text { opacity: 1; transform: translateY(0); }
    #scene2.active .hb-main { opacity: 1; transform: scale(1); }
    #scene2.active .gold-swish path { stroke-dashoffset: 0; }
    #scene2.active .sub-worth { opacity: 1; }

    /* ---------------- SCENE 3: HEART TREE (MOBILE FIT) ---------------- */
    #scene3 {
      background: radial-gradient(circle at 50% 38%, #f9e2ec 0%, #f4ebe2 60%, #ebe0d5 100%);
      z-index: 30;
    }

    #tree-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .bottom-card {
      position: absolute;
      bottom: 6%;
      left: 50%;
      transform: translate(-50%, 20px);
      width: 88%;
      max-width: 360px;
      text-align: center;
      background: rgba(248, 241, 235, 0.88);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 14px 20px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(140, 59, 90, 0.1);
      z-index: 35;
      opacity: 0;
      transition: all 0.9s ease;
    }

    .bottom-card.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .bottom-card .count-text {
      font-style: italic;
      font-size: 1.25rem;
      color: #8c3b5a;
    }

    .bottom-card .script-hb {
      font-family: 'Great Vibes', cursive;
      font-size: 3.3rem;
      color: #c90f64;
      padding: 4px 0;
      border-top: 1px solid rgba(201, 15, 100, 0.25);
      border-bottom: 1px solid rgba(201, 15, 100, 0.25);
      margin: 6px 0;
      white-space: nowrap;
    }

    .bottom-card .bloom-sub {
      font-style: italic;
      font-size: 1.15rem;
      color: #6d4c5b;
    }
  </style>
</head>
<body>

  <div id="app">
    <!-- SCENE 1: Bow and Arrow -->
    <div id="scene1" class="screen">
      <div class="top-sub">a little something, for you</div>

      <svg id="heart-target" viewBox="0 0 200 200">
        <defs>
          <radialGradient id="glossyHeart" cx="35%" cy="30%" r="65%">
            <stop offset="0%" stop-color="#ff99c8" />
            <stop offset="35%" stop-color="#e82578" />
            <stop offset="80%" stop-color="#a8064d" />
            <stop offset="100%" stop-color="#700232" />
          </radialGradient>
          <filter id="blurHighlight">
            <feGaussianBlur stdDeviation="4" />
          </filter>
        </defs>
        <path d="M100,175 C100,175 20,120 20,65 C20,30 50,15 75,15 C90,15 100,28 100,28 C100,28 110,15 125,15 C150,15 180,30 180,65 C180,120 100,175 100,175 Z" fill="url(#glossyHeart)" />
        <ellipse cx="62" cy="52" rx="18" ry="10" transform="rotate(-30 62 52)" fill="rgba(255,255,255,0.45)" filter="url(#blurHighlight)" />
      </svg>

      <svg id="bow-svg">
        <g id="bow-group">
          <polyline id="bow-string" points="0,-65 0,0 0,65" fill="none" stroke="#8c6d62" stroke-width="2" />
          <path d="M 0,-65 C 34,-30 34,30 0,65" fill="none" stroke="#4a2511" stroke-width="4.5" stroke-linecap="round" />
        </g>

        <g id="arrow-group">
          <line x1="-55" y1="0" x2="30" y2="0" stroke="#5c3828" stroke-width="3" />
          <path d="M -45,0 L -57,-8 L -47,-8 L -35,0 Z" fill="#e82578" />
          <path d="M -45,0 L -57,8 L -47,8 L -35,0 Z" fill="#ff7aa8" />
          <path d="M 40,0 L 26,-8 C 22,-10 20,-4 26,0 C 20,4 22,10 26,8 Z" fill="#d91b6b" />
        </g>
      </svg>

      <div class="instruction">PULL &amp; RELEASE</div>
      <div id="pink-wipe"></div>
    </div>

    <!-- SCENE 2: Pink Birthday Banner -->
    <div id="scene2" class="screen hidden">
      <div class="banner-bar">
        <div class="wish-text">make a wish...</div>
        <div class="hb-main">Happy<br>Birthday</div>
        <svg class="gold-swish" viewBox="0 0 300 40">
          <path d="M 20,25 Q 150,5 280,20 Q 170,38 70,28" fill="none" stroke="#d4af37" stroke-width="2.8" stroke-linecap="round"/>
        </svg>
        <div class="sub-worth">to someone worth celebrating</div>
      </div>
    </div>

    <!-- SCENE 3: Growing Heart Tree -->
    <div id="scene3" class="screen hidden">
      <canvas id="tree-canvas"></canvas>
      <div class="bottom-card" id="final-text">
        <div class="count-text">and... make it count</div>
        <div class="script-hb">Happy Birthday</div>
        <div class="bloom-sub">Here's to a year that blooms</div>
      </div>
    </div>
  </div>

  <script>
    // Prevent default touch scrolling everywhere
    document.addEventListener('touchmove', function(e) {
      e.preventDefault();
    }, { passive: false });

    /* ================= SCENE 1 LOGIC ================= */
    const bowSvg = document.getElementById('bow-svg');
    const bowGroup = document.getElementById('bow-group');
    const bowString = document.getElementById('bow-string');
    const arrowGroup = document.getElementById('arrow-group');
    const heartTarget = document.getElementById('heart-target');
    const pinkWipe = document.getElementById('pink-wipe');

    let bowX, bowY, targetX, targetY, bowAngle;
    let isDragging = false;
    let pullDist = 0;
    let arrowLaunched = false;

    function updatePositions() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      bowX = w * 0.5;
      bowY = h * 0.72;

      const rect = heartTarget.getBoundingClientRect();
      targetX = rect.left + rect.width / 2;
      targetY = rect.top + rect.height / 2;

      bowAngle = Math.atan2(targetY - bowY, targetX - bowX);
      renderBow(0);
    }

    function renderBow(pull) {
      const deg = bowAngle * (180 / Math.PI);
      bowGroup.setAttribute('transform', `translate(${bowX}, ${bowY}) rotate(${deg})`);
      bowString.setAttribute('points', `0,-65 ${-pull},0 0,65`);

      if (!arrowLaunched) {
        const offsetX = Math.cos(bowAngle) * (-pull);
        const offsetY = Math.sin(bowAngle) * (-pull);
        arrowGroup.setAttribute('transform', `translate(${bowX + offsetX}, ${bowY + offsetY}) rotate(${deg})`);
      }
    }

    window.addEventListener('resize', updatePositions);
    updatePositions();

    function startDrag(e) {
      if (arrowLaunched) return;
      isDragging = true;
    }

    function onDrag(e) {
      if (!isDragging || arrowLaunched) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const dx = bowX - clientX;
      const dy = bowY - clientY;
      pullDist = Math.min(Math.max(Math.hypot(dx, dy) * 0.65, 0), 75);

      // Always keep arrow aimed towards the heart so it never misses on mobile
      bowAngle = Math.atan2(targetY - bowY, targetX - bowX);
      renderBow(pullDist);
    }

    function endDrag() {
      if (!isDragging || arrowLaunched) return;
      isDragging = false;

      if (pullDist > 18) {
        launchArrow();
      } else {
        pullDist = 0;
        renderBow(0);
      }
    }

    bowSvg.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', onDrag);
    window.addEventListener('mouseup', endDrag);

    bowSvg.addEventListener('touchstart', startDrag, { passive: true });
    window.addEventListener('touchmove', onDrag, { passive: false });
    window.addEventListener('touchend', endDrag);

    function launchArrow() {
      arrowLaunched = true;
      bowString.setAttribute('points', `0,-65 0,0 0,65`);

      const startX = bowX;
      const startY = bowY;
      const deg = bowAngle * (180 / Math.PI);
      let progress = 0;

      function animateArrow() {
        progress += 0.065;
        const curX = startX + (targetX - startX) * progress;
        const curY = startY + (targetY - startY) * progress;
        arrowGroup.setAttribute('transform', `translate(${curX}, ${curY}) rotate(${deg})`);

        if (progress < 0.95) {
          requestAnimationFrame(animateArrow);
        } else {
          triggerScene2();
        }
      }
      requestAnimationFrame(animateArrow);
    }

    /* ================= SCENE 2 TRANSITION ================= */
    function triggerScene2() {
      const xPct = Math.round((targetX / window.innerWidth) * 100);
      const yPct = Math.round((targetY / window.innerHeight) * 100);
      pinkWipe.style.clipPath = `circle(0% at ${xPct}% ${yPct}%)`;

      requestAnimationFrame(() => {
        pinkWipe.style.clipPath = `circle(150% at ${xPct}% ${yPct}%)`;
      });

      setTimeout(() => {
        document.getElementById('scene1').classList.add('hidden');
        const scene2 = document.getElementById('scene2');
        scene2.classList.remove('hidden');
        setTimeout(() => scene2.classList.add('active'), 50);
        setTimeout(triggerScene3, 3800);
      }, 820);
    }

    /* ================= SCENE 3 LOGIC (CENTERED HEART TREE) ================= */
    function triggerScene3() {
      document.getElementById('scene2').classList.add('hidden');
      document.getElementById('scene3').classList.remove('hidden');
      initTreeCanvas();
    }

    function initTreeCanvas() {
      const canvas = document.getElementById('tree-canvas');
      const ctx = canvas.getContext('2d');

      const dpr = window.devicePixelRatio || 1;
      const W = window.innerWidth;
      const H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.scale(dpr, dpr);

      // Fit perfectly on any mobile width & height
      const heartScale = Math.min(W * 0.023, H * 0.0115);

      const treeBaseX = W * 0.5;
      const treeBaseY = H;

      // Place the heart canopy nicely in the upper-middle area
      const heartCenterX = treeBaseX;
      const heartCenterY = H * 0.35;

      // Trunk ends inside the bottom of the heart canopy
      const trunkTopY = heartCenterY + heartScale * 8.5;

      let branches = [];
      let balloons = [];
      let floatingHearts = [];

      function generateBranches(x1, y1, angle, length, depth) {
        if (depth === 0) return;
        const x2 = x1 + Math.cos(angle) * length;
        const y2 = y1 + Math.sin(angle) * length;

        branches.push({
          x1, y1, x2, y2,
          depth,
          progress: 0,
          started: depth === 5
        });

        const spread = 0.34 + Math.random() * 0.12;
        generateBranches(x2, y2, angle - spread, length * 0.72, depth - 1);
        generateBranches(x2, y2, angle + spread, length * 0.72, depth - 1);
        if (depth >= 4) {
          generateBranches(x2, y2, angle + (Math.random() - 0.5) * 0.22, length * 0.74, depth - 1);
        }
      }

      // Branches strictly sized to stay inside the heart canopy
      generateBranches(treeBaseX, trunkTopY, -Math.PI / 2, heartScale * 5.8, 5);

      const palette = [
        '#e82578', '#ff5c9e', '#ff9ebb', '#c90f64',
        '#f4a261', '#ffd166', '#d91b6b', '#ff758f'
      ];

      // 460 lush 3D heart leaves filling the entire canopy
      for (let i = 0; i < 460; i++) {
        const t = Math.random() * Math.PI * 2;
        const r = Math.pow(Math.random(), 0.42);
        const hx = 16 * Math.pow(Math.sin(t), 3);
        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - 1 * Math.cos(4 * t));

        balloons.push({
          x: heartCenterX + hx * heartScale * r + (Math.random() - 0.5) * heartScale * 1.1,
          y: heartCenterY + hy * heartScale * r + (Math.random() - 0.5) * heartScale * 1.1,
          size: 0,
          maxSize: heartScale * (1.15 + Math.random() * 1.1),
          color: palette[Math.floor(Math.random() * palette.length)],
          delay: 50 + Math.random() * 80,
          angle: (Math.random() - 0.5) * 0.65
        });
      }

      function drawHeartBalloon(x, y, size, color, angle) {
        if (size <= 0.3) return;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        ctx.beginPath();
        const s = size * 0.88;
        ctx.moveTo(0, s * 0.35);
        ctx.bezierCurveTo(-s * 1.1, -s * 0.4, -s * 0.55, -s * 1.15, 0, -s * 0.45);
        ctx.bezierCurveTo(s * 0.55, -s * 1.15, s * 1.1, -s * 0.4, 0, s * 0.35);
        ctx.closePath();

        ctx.fillStyle = color;
        ctx.fill();

        const grad = ctx.createRadialGradient(-s * 0.25, -s * 0.45, s * 0.05, 0, 0, s * 1.1);
        grad.addColorStop(0, 'rgba(255, 255, 255, 0.65)');
        grad.addColorStop(0.45, 'rgba(255, 255, 255, 0)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0.18)');
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.restore();
      }

      let frame = 0;
      let trunkProgress = 0;

      function animateScene3() {
        ctx.clearRect(0, 0, W, H);
        frame++;

        // 1. Grow main trunk
        if (trunkProgress < 1) {
          trunkProgress += 0.032;
        }
        const curTrunkY = treeBaseY - (treeBaseY - trunkTopY) * Math.min(trunkProgress, 1);

        ctx.strokeStyle = '#3d1e10';
        ctx.lineWidth = 11;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(treeBaseX, treeBaseY);
        ctx.lineTo(treeBaseX, curTrunkY);
        ctx.stroke();

        // 2. Grow branches
        if (trunkProgress >= 1) {
          branches.forEach(b => {
            if (b.started && b.progress < 1) {
              b.progress += 0.065;
              if (b.progress >= 1) {
                branches.forEach(child => {
                  if (child.depth === b.depth - 1 && Math.hypot(child.x1 - b.x2, child.y1 - b.y2) < 2) {
                    child.started = true;
                  }
                });
              }
            }

            if (b.started) {
              const p = Math.min(b.progress, 1);
              const curX = b.x1 + (b.x2 - b.x1) * p;
              const curY = b.y1 + (b.y2 - b.y1) * p;

              ctx.strokeStyle = '#3d1e10';
              ctx.lineWidth = Math.max(b.depth * 1.6, 1.4);
              ctx.beginPath();
              ctx.moveTo(b.x1, b.y1);
              ctx.lineTo(curX, curY);
              ctx.stroke();
            }
          });
        }

        // 3. Show card & bloom heart canopy
        if (frame > 60) {
          document.getElementById('final-text').classList.add('show');
        }

        balloons.forEach(bl => {
          if (frame > bl.delay) {
            if (bl.size < bl.maxSize) {
              bl.size += (bl.maxSize - bl.size) * 0.12;
            }
            const swayX = Math.sin(frame * 0.03 + bl.delay) * 1.4;
            const swayY = Math.cos(frame * 0.025 + bl.delay) * 1.4;
            drawHeartBalloon(bl.x + swayX, bl.y + swayY, bl.size, bl.color, bl.angle);
          }
        });

        // 4. Floating heart petals
        if (frame > 105 && Math.random() < 0.1) {
          floatingHearts.push({
            x: heartCenterX + (Math.random() - 0.5) * heartScale * 20,
            y: heartCenterY + (Math.random() - 0.2) * heartScale * 12,
            vx: (Math.random() - 0.5) * 1.2,
            vy: 0.45 + Math.random() * 0.55,
            size: heartScale * (0.55 + Math.random() * 0.45),
            color: palette[Math.floor(Math.random() * palette.length)],
            angle: (Math.random() - 0.5) * 0.8,
            alpha: 1
          });
        }

        floatingHearts.forEach((fh, idx) => {
          fh.x += fh.vx;
          fh.y += fh.vy;
          fh.angle += 0.01;
          fh.alpha -= 0.0045;
          if (fh.alpha <= 0) {
            floatingHearts.splice(idx, 1);
          } else {
            ctx.save();
            ctx.globalAlpha = fh.alpha;
            drawHeartBalloon(fh.x, fh.y, fh.size, fh.color, fh.angle);
            ctx.restore();
          }
        });

        requestAnimationFrame(animateScene3);
      }

      animateScene3();
    }
  </script>
</body>
</html>
