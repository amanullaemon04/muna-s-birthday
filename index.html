<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Something, For You</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Great+Vibes&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #fdfbfb 0%, #ebedee 100%);
      background-color: #f7efe8;
      font-family: 'Cormorant Garamond', serif;
    }

    /* Screen Containers */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s ease;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* ---------------- SCENE 1: BOW & HEART ---------------- */
    #scene1 {
      background: radial-gradient(circle at 60% 45%, #f5d7e3 0%, #f5ece6 45%, #efe6dd 100%);
    }

    .top-sub {
      position: absolute;
      top: 22%;
      left: 60%;
      transform: translateX(-50%);
      font-style: italic;
      font-size: 1.4rem;
      color: #6d4c5b;
      letter-spacing: 0.5px;
    }

    #heart-target {
      position: absolute;
      top: 30%;
      left: 60%;
      transform: translate(-50%, 0);
      width: 150px;
      height: 150px;
      filter: drop-shadow(0 20px 30px rgba(216, 43, 119, 0.35));
      animation: floatHeart 3s ease-in-out infinite;
    }

    @keyframes floatHeart {
      0%, 100% { transform: translate(-50%, 0px) scale(1); }
      50% { transform: translate(-50%, -12px) scale(1.03); }
    }

    .instruction {
      position: absolute;
      bottom: 12%;
      font-size: 0.85rem;
      letter-spacing: 3px;
      color: #7c6870;
      text-transform: uppercase;
    }

    /* Interactive SVG Overlay */
    #bow-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #bow-svg:active {
      cursor: grabbing;
    }

    /* Expanding Circle Transition */
    #pink-burst {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: #c90f64;
      border-radius: 50%;
      top: 40%;
      left: 60%;
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      z-index: 20;
      transition: transform 0.9s cubic-bezier(0.65, 0, 0.35, 1);
    }

    /* ---------------- SCENE 2: PINK BANNER ---------------- */
    #scene2 {
      background-color: #f5ece6;
      z-index: 25;
    }

    .banner-bar {
      width: 100%;
      height: 60%;
      background-color: #c90f64;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      position: relative;
      box-shadow: 0 10px 40px rgba(201, 15, 100, 0.25);
    }

    .wish-text {
      font-style: italic;
      font-size: 1.5rem;
      color: #f7d4e3;
      margin-bottom: 10px;
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.8s ease 0.3s;
    }

    .hb-main {
      font-family: 'Playfair Display', serif;
      font-size: 5.5rem;
      line-height: 0.95;
      text-align: center;
      letter-spacing: -1px;
      opacity: 0;
      transform: scale(0.92);
      transition: all 0.8s ease 0.6s;
    }

    .gold-swish {
      width: 240px;
      height: 30px;
      margin-top: 8px;
    }

    .gold-swish path {
      stroke-dasharray: 500;
      stroke-dashoffset: 500;
      transition: stroke-dashoffset 1.2s ease 1.1s;
    }

    .sub-worth {
      font-style: italic;
      font-size: 1.3rem;
      color: #f7d4e3;
      margin-top: 6px;
      opacity: 0;
      transition: opacity 0.8s ease 1.4s;
    }

    /* Active State Animations for Scene 2 */
    #scene2.active .wish-text {
      opacity: 1;
      transform: translateY(0);
    }
    #scene2.active .hb-main {
      opacity: 1;
      transform: scale(1);
    }
    #scene2.active .gold-swish path {
      stroke-dashoffset: 0;
    }
    #scene2.active .sub-worth {
      opacity: 1;
    }

    /* ---------------- SCENE 3: HEART TREE ---------------- */
    #scene3 {
      background: radial-gradient(circle at 70% 50%, #f7e6ed 0%, #f3eae2 60%, #ebe0d6 100%);
      z-index: 30;
    }

    #tree-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .left-message {
      position: absolute;
      left: 10%;
      bottom: 16%;
      z-index: 35;
      opacity: 0;
      transform: translateY(20px);
      transition: all 1s ease;
    }

    .left-message.show {
      opacity: 1;
      transform: translateY(0);
    }

    .left-message .count-text {
      font-style: italic;
      font-size: 1.5rem;
      color: #8c3b5a;
      margin-bottom: -5px;
    }

    .left-message .script-hb {
      font-family: 'Great Vibes', cursive;
      font-size: 5.2rem;
      color: #c90f64;
      padding: 5px 0;
      border-top: 1px solid rgba(201, 15, 100, 0.3);
      border-bottom: 1px solid rgba(201, 15, 100, 0.3);
      margin: 8px 0;
    }

    .left-message .bloom-sub {
      font-style: italic;
      font-size: 1.25rem;
      color: #6d4c5b;
    }

    @media (max-width: 768px) {
      .hb-main { font-size: 3.6rem; }
      .left-message { left: 6%; bottom: 10%; }
      .left-message .script-hb { font-size: 3.5rem; }
      #heart-target { width: 110px; height: 110px; }
    }
  </style>
</head>
<body>

  <!-- SCENE 1: Bow and Arrow -->
  <div id="scene1" class="screen">
    <div class="top-sub">a little something, for you</div>

    <!-- 3D Glossy Heart SVG -->
    <svg id="heart-target" viewBox="0 0 200 200">
      <defs>
        <radialGradient id="glossyHeart" cx="35%" cy="30%" r="65%">
          <stop offset="0%" stop-color="#ff99c8" />
          <stop offset="35%" stop-color="#e82578" />
          <stop offset="80%" stop-color="#a8064d" />
          <stop offset="100%" stop-color="#700232" />
        </radialGradient>
        <filter id="blurHighlight">
          <feGaussianBlur stdDeviation="4" />
        </filter>
      </defs>
      <path d="M100,175 C100,175 20,120 20,65 C20,30 50,15 75,15 C90,15 100,28 100,28 C100,28 110,15 125,15 C150,15 180,30 180,65 C180,120 100,175 100,175 Z" fill="url(#glossyHeart)" />
      <!-- Specular Highlight -->
      <ellipse cx="62" cy="52" rx="18" ry="10" transform="rotate(-30 62 52)" fill="rgba(255,255,255,0.45)" filter="url(#blurHighlight)" />
    </svg>

    <!-- Interactive Bow SVG -->
    <svg id="bow-svg">
      <g id="bow-group">
        <!-- Bow String -->
        <polyline id="bow-string" points="0,-75 0,0 0,75" fill="none" stroke="#8c6d62" stroke-width="1.8" />
        <!-- Bow Wood Arc -->
        <path d="M 0,-75 C 38,-35 38,35 0,75" fill="none" stroke="#4a2511" stroke-width="4.5" stroke-linecap="round" />
      </g>

      <!-- Arrow Group -->
      <g id="arrow-group">
        <!-- Shaft -->
        <line x1="-65" y1="0" x2="35" y2="0" stroke="#5c3828" stroke-width="3" />
        <!-- Fletching (Feathers) -->
        <path d="M -55,0 L -68,-8 L -58,-8 L -45,0 Z" fill="#e82578" />
        <path d="M -55,0 L -68,8 L -58,8 L -45,0 Z" fill="#ff7aa8" />
        <!-- Heart Tip -->
        <path d="M 45,0 L 30,-8 C 26,-10 24,-4 30,0 C 24,4 26,10 30,8 Z" fill="#d91b6b" />
      </g>
    </svg>

    <div class="instruction">PULL &amp; RELEASE</div>
    <div id="pink-burst"></div>
  </div>

  <!-- SCENE 2: Pink Birthday Banner -->
  <div id="scene2" class="screen hidden">
    <div class="banner-bar">
      <div class="wish-text">make a wish...</div>
      <div class="hb-main">Happy<br>Birthday</div>
      <svg class="gold-swish" viewBox="0 0 300 40">
        <path d="M 20,25 Q 150,5 280,20 Q 170,38 70,28" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <div class="sub-worth">to someone worth celebrating</div>
    </div>
  </div>

  <!-- SCENE 3: Growing Tree & Heart Leaves -->
  <div id="scene3" class="screen hidden">
    <canvas id="tree-canvas"></canvas>
    <div class="left-message" id="final-text">
      <div class="count-text">and... make it count</div>
      <div class="script-hb">Happy Birthday</div>
      <div class="bloom-sub">Here's to a year that blooms</div>
    </div>
  </div>

  <script>
    /* ================= SCENE 1 LOGIC (BOW & ARROW) ================= */
    const bowSvg = document.getElementById('bow-svg');
    const bowGroup = document.getElementById('bow-group');
    const bowString = document.getElementById('bow-string');
    const arrowGroup = document.getElementById('arrow-group');
    const heartTarget = document.getElementById('heart-target');
    const pinkBurst = document.getElementById('pink-burst');

    let bowX = window.innerWidth * 0.28;
    let bowY = window.innerHeight * 0.68;
    let targetX = window.innerWidth * 0.60;
    let targetY = window.innerHeight * 0.40;

    let isDragging = false;
    let pullDist = 0;
    let bowAngle = -0.5;
    let arrowLaunched = false;

    function updatePositions() {
      bowX = window.innerWidth * 0.28;
      bowY = window.innerHeight * 0.68;
      const rect = heartTarget.getBoundingClientRect();
      targetX = rect.left + rect.width / 2;
      targetY = rect.top + rect.height / 2;
      bowAngle = Math.atan2(targetY - bowY, targetX - bowX);
      renderBow(0);
    }

    function renderBow(pull) {
      const deg = bowAngle * (180 / Math.PI);
      bowGroup.setAttribute('transform', `translate(${bowX}, ${bowY}) rotate(${deg})`);
      bowString.setAttribute('points', `0,-75 ${-pull},0 0,75`);

      if (!arrowLaunched) {
        const offsetX = Math.cos(bowAngle) * (-pull);
        const offsetY = Math.sin(bowAngle) * (-pull);
        arrowGroup.setAttribute('transform', `translate(${bowX + offsetX}, ${bowY + offsetY}) rotate(${deg})`);
      }
    }

    window.addEventListener('resize', updatePositions);
    updatePositions();

    function startDrag(e) {
      if (arrowLaunched) return;
      isDragging = true;
    }

    function onDrag(e) {
      if (!isDragging || arrowLaunched) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const dx = bowX - clientX;
      const dy = bowY - clientY;
      pullDist = Math.min(Math.max(Math.hypot(dx, dy) * 0.6, 0), 85);

      // Slight aim adjustment towards target
      const aimAngle = Math.atan2(targetY - bowY, targetX - bowX);
      bowAngle = aimAngle;
      renderBow(pullDist);
    }

    function endDrag() {
      if (!isDragging || arrowLaunched) return;
      isDragging = false;

      if (pullDist > 25) {
        launchArrow();
      } else {
        pullDist = 0;
        renderBow(0);
      }
    }

    bowSvg.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', onDrag);
    window.addEventListener('mouseup', endDrag);

    bowSvg.addEventListener('touchstart', startDrag);
    window.addEventListener('touchmove', onDrag);
    window.addEventListener('touchend', endDrag);

    function launchArrow() {
      arrowLaunched = true;
      // Snap string back
      bowString.setAttribute('points', `0,-75 0,0 0,75`);

      let startX = bowX;
      let startY = bowY;
      const deg = bowAngle * (180 / Math.PI);
      let progress = 0;

      function animateArrow() {
        progress += 0.06;
        const curX = startX + (targetX - startX) * progress;
        const curY = startY + (targetY - startY) * progress;

        arrowGroup.setAttribute('transform', `translate(${curX}, ${curY}) rotate(${deg})`);

        if (progress < 0.95) {
          requestAnimationFrame(animateArrow);
        } else {
          triggerScene2();
        }
      }
      requestAnimationFrame(animateArrow);
    }

    /* ================= SCENE 2 TRANSITION ================= */
    function triggerScene2() {
      pinkBurst.style.left = `${targetX}px`;
      pinkBurst.style.top = `${targetY}px`;
      pinkBurst.style.transform = 'translate(-50%, -50%) scale(220)';

      setTimeout(() => {
        document.getElementById('scene1').classList.add('hidden');
        const scene2 = document.getElementById('scene2');
        scene2.classList.remove('hidden');
        // Trigger CSS animations
        setTimeout(() => scene2.classList.add('active'), 50);

        // Move to Scene 3 after banner showcase
        setTimeout(triggerScene3, 4200);
      }, 850);
    }

    /* ================= SCENE 3 LOGIC (HEART BALLOON TREE) ================= */
    function triggerScene3() {
      const scene2 = document.getElementById('scene2');
      const scene3 = document.getElementById('scene3');
      scene2.classList.add('hidden');
      scene3.classList.remove('hidden');

      initTreeCanvas();
    }

    function initTreeCanvas() {
      const canvas = document.getElementById('tree-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const treeBaseX = canvas.width * 0.68;
      const treeBaseY = canvas.height;
      const trunkTopY = canvas.height * 0.56;

      let branches = [];
      let balloons = [];
      let floatingHearts = [];

      // Create fractal branches
      function generateBranches(x1, y1, angle, length, depth) {
        if (depth === 0) return;
        const x2 = x1 + Math.cos(angle) * length;
        const y2 = y1 + Math.sin(angle) * length;

        branches.push({
          x1, y1, x2, y2,
          depth,
          progress: 0,
          started: depth === 5
        });

        // Sub-branches
        generateBranches(x2, y2, angle - 0.35 - Math.random() * 0.15, length * 0.75, depth - 1);
        generateBranches(x2, y2, angle + 0.35 + Math.random() * 0.15, length * 0.75, depth - 1);
        if (Math.random() > 0.45) {
          generateBranches(x2, y2, angle + (Math.random() - 0.5) * 0.3, length * 0.78, depth - 1);
        }
      }

      generateBranches(treeBaseX, trunkTopY, -Math.PI / 2, canvas.height * 0.13, 5);

      // Generate Heart-Shaped Canopy Coordinates
      const palette = ['#e82578', '#ff66a3', '#ffb3d1', '#d41b65', '#f5a65b', '#ffd166', '#c90f64'];
      const heartCenterX = treeBaseX;
      const heartCenterY = canvas.height * 0.40;
      const scale = Math.min(canvas.width, canvas.height) * 0.0115;

      for (let i = 0; i < 340; i++) {
        // Parametric heart formula with internal fill distribution
        const t = Math.random() * Math.PI * 2;
        const r = Math.sqrt(Math.random());
        const hx = 16 * Math.pow(Math.sin(t), 3);
        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

        balloons.push({
          x: heartCenterX + hx * scale * r + (Math.random() - 0.5) * 18,
          y: heartCenterY + hy * scale * r + (Math.random() - 0.5) * 18,
          size: 0,
          maxSize: 10 + Math.random() * 14,
          color: palette[Math.floor(Math.random() * palette.length)],
          delay: 70 + Math.random() * 90,
          angle: (Math.random() - 0.5) * 0.6
        });
      }

      // Draw glossy 3D balloon/heart leaf
      function drawBalloon(x, y, size, color, angle) {
        if (size <= 0.2) return;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        // Balloon teardrop/heart body
        ctx.beginPath();
        ctx.arc(0, 0, size, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();

        // 3D Shine highlight
        const grad = ctx.createRadialGradient(-size * 0.3, -size * 0.3, size * 0.1, 0, 0, size);
        grad.addColorStop(0, 'rgba(255,255,255,0.65)');
        grad.addColorStop(0.5, 'rgba(255,255,255,0)');
        grad.addColorStop(1, 'rgba(0,0,0,0.18)');
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.restore();
      }

      let frame = 0;
      let trunkProgress = 0;

      function animateScene3() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        frame++;

        // 1. Grow main trunk
        if (trunkProgress < 1) {
          trunkProgress += 0.025;
        }
        const curTrunkY = treeBaseY - (treeBaseY - trunkTopY) * Math.min(trunkProgress, 1);

        ctx.strokeStyle = '#3d1e10';
        ctx.lineWidth = 18;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(treeBaseX, treeBaseY);
        ctx.lineTo(treeBaseX, curTrunkY);
        ctx.stroke();

        // 2. Grow fractal branches after trunk finishes
        if (trunkProgress >= 1) {
          branches.forEach(b => {
            if (b.started && b.progress < 1) {
              b.progress += 0.05;
              if (b.progress >= 1) {
                // Trigger children branches
                branches.forEach(child => {
                  if (child.depth === b.depth - 1 && Math.hypot(child.x1 - b.x2, child.y1 - b.y2) < 2) {
                    child.started = true;
                  }
                });
              }
            }

            if (b.started) {
              const p = Math.min(b.progress, 1);
              const curX = b.x1 + (b.x2 - b.x1) * p;
              const curY = b.y1 + (b.y2 - b.y1) * p;

              ctx.strokeStyle = '#3d1e10';
              ctx.lineWidth = b.depth * 2.4;
              ctx.beginPath();
              ctx.moveTo(b.x1, b.y1);
              ctx.lineTo(curX, curY);
              ctx.stroke();
            }
          });
        }

        // 3. Bloom Heart Canopy Balloons
        if (frame > 75) {
          document.getElementById('final-text').classList.add('show');
        }

        balloons.forEach(bl => {
          if (frame > bl.delay) {
            if (bl.size < bl.maxSize) {
              bl.size += (bl.maxSize - bl.size) * 0.1;
            }
            const swayX = Math.sin(frame * 0.03 + bl.delay) * 1.8;
            const swayY = Math.cos(frame * 0.025 + bl.delay) * 1.5;
            drawBalloon(bl.x + swayX, bl.y + swayY, bl.size, bl.color, bl.angle);
          }
        });

        // 4. Floating small petals/hearts
        if (frame > 130 && Math.random() < 0.08) {
          floatingHearts.push({
            x: heartCenterX + (Math.random() - 0.5) * 260,
            y: heartCenterY + 60 + Math.random() * 80,
            vx: -0.6 - Math.random() * 0.8,
            vy: 0.4 + Math.random() * 0.6,
            size: 4 + Math.random() * 5,
            color: palette[Math.floor(Math.random() * palette.length)],
            alpha: 1
          });
        }

        floatingHearts.forEach((fh, idx) => {
          fh.x += fh.vx;
          fh.y += fh.vy;
          fh.alpha -= 0.004;
          if (fh.alpha <= 0) {
            floatingHearts.splice(idx, 1);
          } else {
            ctx.save();
            ctx.globalAlpha = fh.alpha;
            drawBalloon(fh.x, fh.y, fh.size, fh.color, 0);
            ctx.restore();
          }
        });

        requestAnimationFrame(animateScene3);
      }

      animateScene3();
    }
  </script>
</body>
</html>
