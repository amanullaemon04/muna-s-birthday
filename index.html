<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Happy Birthday, My Love 💕</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: #f7efe8;
      font-family: 'Cormorant Garamond', serif;
    }

    #intro-stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      z-index: 50;
      transition: opacity 0.8s ease;
    }

    .screen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      transition: opacity 0.7s ease;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* ---------------- SCENE 1: BOW & HEART ---------------- */
    #scene1 {
      background: radial-gradient(circle at 50% 30%, #f7d6e4 0%, #f5ece6 55%, #efe5dc 100%);
      z-index: 10;
    }

    .top-sub {
      position: absolute;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      font-style: italic;
      font-size: 1.35rem;
      color: #6d4c5b;
      white-space: nowrap;
      z-index: 2;
    }

    #heart-target {
      position: absolute;
      top: 19%;
      left: 50%;
      transform: translateX(-50%);
      width: 125px;
      height: 125px;
      filter: drop-shadow(0 16px 24px rgba(216, 43, 119, 0.35));
      animation: floatHeart 2.8s ease-in-out infinite;
      z-index: 2;
    }

    @keyframes floatHeart {
      0%, 100% { transform: translate(-50%, 0px) scale(1); }
      50% { transform: translate(-50%, -10px) scale(1.04); }
    }

    #bow-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      touch-action: none;
    }

    .instruction {
      position: absolute;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      letter-spacing: 3px;
      color: #7c6870;
      text-transform: uppercase;
      white-space: nowrap;
      z-index: 2;
    }

    #pink-wipe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #c90f64;
      clip-path: circle(0% at 50% 28%);
      pointer-events: none;
      z-index: 15;
      transition: clip-path 0.85s cubic-bezier(0.65, 0, 0.35, 1);
    }

    /* ---------------- SCENE 2: PINK BANNER ---------------- */
    #scene2 {
      background-color: #f5ece6;
      z-index: 20;
    }

    .banner-bar {
      width: 100%;
      height: 52%;
      background-color: #c90f64;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 0 20px;
      box-shadow: 0 12px 35px rgba(201, 15, 100, 0.25);
    }

    .wish-text {
      font-style: italic;
      font-size: 1.35rem;
      color: #f7d4e3;
      margin-bottom: 8px;
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.7s ease 0.2s;
    }

    .hb-main {
      font-family: 'Playfair Display', serif;
      font-size: 3.8rem;
      line-height: 0.96;
      text-align: center;
      letter-spacing: -0.5px;
      opacity: 0;
      transform: scale(0.92);
      transition: all 0.7s ease 0.5s;
    }

    .gold-swish {
      width: 200px;
      height: 28px;
      margin-top: 8px;
    }

    .gold-swish path {
      stroke-dasharray: 500;
      stroke-dashoffset: 500;
      transition: stroke-dashoffset 1.1s ease 0.9s;
    }

    .sub-worth {
      font-style: italic;
      font-size: 1.2rem;
      color: #f7d4e3;
      margin-top: 6px;
      opacity: 0;
      transition: opacity 0.7s ease 1.2s;
    }

    #scene2.active .wish-text { opacity: 1; transform: translateY(0); }
    #scene2.active .hb-main { opacity: 1; transform: scale(1); }
    #scene2.active .gold-swish path { stroke-dashoffset: 0; }
    #scene2.active .sub-worth { opacity: 1; }

    /* ---------------- SCENE 3: HEART TREE ---------------- */
    #scene3 {
      background: radial-gradient(circle at 50% 35%, #f9e2ec 0%, #f4ebe2 60%, #ebe0d5 100%);
      z-index: 30;
    }

    #tree-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .bottom-card {
      position: absolute;
      bottom: 4%;
      left: 50%;
      transform: translate(-50%, 20px);
      width: 90%;
      max-width: 360px;
      text-align: center;
      background: rgba(248, 241, 235, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 14px 18px 18px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(140, 59, 90, 0.15);
      z-index: 35;
      opacity: 0;
      transition: all 0.9s ease;
    }

    .bottom-card.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .bottom-card .count-text {
      font-style: italic;
      font-size: 1.2rem;
      color: #8c3b5a;
    }

    .bottom-card .script-hb {
      font-family: 'Great Vibes', cursive;
      font-size: 3.1rem;
      color: #c90f64;
      padding: 2px 0;
      border-top: 1px solid rgba(201, 15, 100, 0.25);
      border-bottom: 1px solid rgba(201, 15, 100, 0.25);
      margin: 5px 0;
      white-space: nowrap;
    }

    .bottom-card .bloom-sub {
      font-style: italic;
      font-size: 1.1rem;
      color: #6d4c5b;
      margin-bottom: 12px;
    }

    .cta-button {
      display: inline-block;
      background: linear-gradient(135deg, #ff4d79, #ff2a6d);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 0.92rem;
      font-weight: 500;
      padding: 11px 24px;
      border: none;
      border-radius: 50px;
      box-shadow: 0 6px 20px rgba(255, 42, 109, 0.4);
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      animation: pulseBtn 2s infinite;
    }

    .cta-button:active {
      transform: scale(0.95);
    }

    @keyframes pulseBtn {
      0%, 100% { box-shadow: 0 6px 20px rgba(255, 42, 109, 0.4); }
      50% { box-shadow: 0 8px 28px rgba(255, 42, 109, 0.7); }
    }

    /* ---------------- SCENE 4: CELEBRATION PAGE (SCROLLABLE) ---------------- */
    #celebration-page {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      background: linear-gradient(180deg, #ffdde8 0%, #ffc2d9 45%, #fff5f8 100%);
      font-family: 'Poppins', sans-serif;
      z-index: 40;
      display: none;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    #celebration-page.active {
      display: block;
      opacity: 1;
    }

    /* Floating Background Particles */
    .particles-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      font-size: 1.1rem;
      opacity: 0.55;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(105vh) rotate(0deg); opacity: 0; }
      15% { opacity: 0.65; }
      85% { opacity: 0.65; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* Hero Section */
    .hero {
      position: relative;
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px 20px;
      z-index: 2;
    }

    .typewriter {
      font-family: 'Dancing Script', cursive;
      font-size: 3rem;
      color: #881337;
      margin-bottom: 14px;
      line-height: 1.2;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.6);
    }

    .subtitle {
      font-size: 0.98rem;
      color: #6b2138;
      max-width: 330px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .floating-hearts {
      display: flex;
      gap: 14px;
      justify-content: center;
      margin-bottom: 30px;
      font-size: 1.45rem;
    }

    .floating-hearts .heart {
      display: inline-block;
      animation: bounceHeart 1.8s ease-in-out infinite;
    }
    .floating-hearts .heart:nth-child(2) { animation-delay: 0.2s; }
    .floating-hearts .heart:nth-child(3) { animation-delay: 0.4s; }
    .floating-hearts .heart:nth-child(4) { animation-delay: 0.6s; }
    .floating-hearts .heart:nth-child(5) { animation-delay: 0.8s; }

    @keyframes bounceHeart {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-10px) scale(1.15); }
    }

    .scroll-indicator {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 40px;
      border: 2px solid #9f1239;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      padding-top: 6px;
      opacity: 0.7;
    }

    .scroll-dot {
      width: 4px;
      height: 8px;
      background-color: #9f1239;
      border-radius: 2px;
      animation: scrollWheel 1.6s infinite;
    }

    @keyframes scrollWheel {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(14px); opacity: 0; }
    }

    /* Photo Gallery Section */
    .gallery-section {
      position: relative;
      z-index: 2;
      padding: 50px 18px 60px;
      background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, #fff 35%, #fff5f8 100%);
      border-top-left-radius: 32px;
      border-top-right-radius: 32px;
    }

    .section-title {
      font-family: 'Dancing Script', cursive;
      font-size: 2.6rem;
      color: #881337;
      text-align: center;
      margin-bottom: 30px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 22px;
      max-width: 420px;
      margin: 0 auto;
    }

    .photo-card {
      border-radius: 18px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 10px 25px rgba(136, 19, 55, 0.12);
      position: relative;
    }

    .photo-container {
      position: relative;
      width: 100%;
      height: 290px;
      overflow: hidden;
    }

    .photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .photo-card:active .photo-container img {
      transform: scale(1.05);
    }

    .photo-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.72) 0%, rgba(0, 0, 0, 0.1) 50%, transparent 100%);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 16px;
      color: #fff;
    }

    .photo-caption {
      font-size: 0.92rem;
      font-weight: 400;
      padding-right: 10px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    .like-btn {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(4px);
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .like-btn.liked {
      background: rgba(255, 42, 109, 0.25);
      transform: scale(1.15);
    }

    /* Special Message Section */
    .message-section {
      position: relative;
      z-index: 2;
      padding: 60px 18px 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      text-align: center;
    }

    .message-card {
      max-width: 440px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.13);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      padding: 32px 22px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    }

    .message-title {
      font-family: 'Dancing Script', cursive;
      font-size: 2.4rem;
      color: #fff;
      margin-bottom: 20px;
    }

    .message-text {
      font-size: 0.92rem;
      line-height: 1.75;
      color: rgba(255, 255, 255, 0.92);
      margin-bottom: 18px;
    }

    .message-signature {
      font-family: 'Dancing Script', cursive;
      font-size: 1.45rem;
      color: #ffd1dc;
      margin-top: 22px;
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .message-hearts {
      display: flex;
      justify-content: center;
      gap: 14px;
      font-size: 1.4rem;
    }

    .heart-animation {
      display: inline-block;
      animation: bounceHeart 1.8s infinite;
    }
    .heart-animation:nth-child(2) { animation-delay: 0.3s; }
    .heart-animation:nth-child(3) { animation-delay: 0.6s; }

    .footer {
      text-align: center;
      padding: 20px 15px;
      background: #881337;
      color: #ffdde8;
      font-size: 0.8rem;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>

  <!-- ================= INTRO STAGE (SCENES 1, 2, 3) ================= -->
  <div id="intro-stage">
    <!-- SCENE 1: Bow and Arrow -->
    <div id="scene1" class="screen">
      <div class="top-sub">a little something, for you</div>

      <svg id="heart-target" viewBox="0 0 200 200">
        <defs>
          <radialGradient id="glossyHeart" cx="35%" cy="30%" r="65%">
            <stop offset="0%" stop-color="#ff99c8" />
            <stop offset="35%" stop-color="#e82578" />
            <stop offset="80%" stop-color="#a8064d" />
            <stop offset="100%" stop-color="#700232" />
          </radialGradient>
          <filter id="blurHighlight">
            <feGaussianBlur stdDeviation="4" />
          </filter>
        </defs>
        <path d="M100,175 C100,175 20,120 20,65 C20,30 50,15 75,15 C90,15 100,28 100,28 C100,28 110,15 125,15 C150,15 180,30 180,65 C180,120 100,175 100,175 Z" fill="url(#glossyHeart)" />
        <ellipse cx="62" cy="52" rx="18" ry="10" transform="rotate(-30 62 52)" fill="rgba(255,255,255,0.45)" filter="url(#blurHighlight)" />
      </svg>

      <svg id="bow-svg">
        <g id="bow-group">
          <polyline id="bow-string" points="0,-65 0,0 0,65" fill="none" stroke="#8c6d62" stroke-width="2" />
          <path d="M 0,-65 C 34,-30 34,30 0,65" fill="none" stroke="#4a2511" stroke-width="4.5" stroke-linecap="round" />
        </g>

        <g id="arrow-group">
          <line x1="-55" y1="0" x2="30" y2="0" stroke="#5c3828" stroke-width="3" />
          <path d="M -45,0 L -57,-8 L -47,-8 L -35,0 Z" fill="#e82578" />
          <path d="M -45,0 L -57,8 L -47,8 L -35,0 Z" fill="#ff7aa8" />
          <path d="M 40,0 L 26,-8 C 22,-10 20,-4 26,0 C 20,4 22,10 26,8 Z" fill="#d91b6b" />
        </g>
      </svg>

      <div class="instruction">PULL &amp; RELEASE</div>
      <div id="pink-wipe"></div>
    </div>

    <!-- SCENE 2: Pink Birthday Banner -->
    <div id="scene2" class="screen hidden">
      <div class="banner-bar">
        <div class="wish-text">make a wish...</div>
        <div class="hb-main">Happy<br>Birthday</div>
        <svg class="gold-swish" viewBox="0 0 300 40">
          <path d="M 20,25 Q 150,5 280,20 Q 170,38 70,28" fill="none" stroke="#d4af37" stroke-width="2.8" stroke-linecap="round"/>
        </svg>
        <div class="sub-worth">to someone worth celebrating</div>
      </div>
    </div>

    <!-- SCENE 3: Growing Heart Tree + CTA Button -->
    <div id="scene3" class="screen hidden">
      <canvas id="tree-canvas"></canvas>
      <div class="bottom-card" id="final-text">
        <div class="count-text">and... make it count</div>
        <div class="script-hb">Happy Birthday</div>
        <div class="bloom-sub">Here's to a year that blooms</div>
        <button class="cta-button" onclick="openCelebrationPage()">
          Start the Celebration 🎉
        </button>
      </div>
    </div>
  </div>

  <!-- ================= SCENE 4: CELEBRATION PAGE (HERO + GALLERY + MESSAGE) ================= -->
  <div id="celebration-page">
    <!-- Floating Background Hearts & Butterflies -->
    <div class="particles-bg" id="particles-bg"></div>

    <!-- Hero Section -->
    <section class="hero" id="hero">
      <h1 class="typewriter">Happy Birthday, Beautiful! 💕</h1>
      <p class="subtitle">Today is all about celebrating you and the joy you bring to my life</p>
      
      <div class="floating-hearts">
        <span class="heart">❤️</span>
        <span class="heart">💖</span>
        <span class="heart">💕</span>
        <span class="heart">💗</span>
        <span class="heart">💓</span>
      </div>

      <button class="cta-button" onclick="scrollToGallery()">
        Start the Celebration 🎉
      </button>

      <div class="scroll-indicator" onclick="scrollToGallery()">
        <div class="scroll-dot"></div>
      </div>
    </section>

    <!-- Photo Gallery Section (Ekhaner img src পরিবর্তন kore nijer chobi dite paro) -->
    <section class="
